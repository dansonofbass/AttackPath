/* Production security operations theme */
:root{
  --bg:#0a0f14;
  --bg2:#0d141b;
  --panel:#111922;
  --panel2:#151e27;
  --panel3:#0e161e;
  --line:#273441;
  --line2:#344351;
  --text:#e8edf2;
  --muted:#8f9cab;
  --muted2:#6f7c89;
  --blue:#4d9bd6;
  --blue2:#76b7e8;
  --red:#d96976;
  --orange:#d39a56;
  --yellow:#c8b45f;
  --green:#4daf82;
  --shadow:0 8px 24px rgba(0,0,0,.16);
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1.45;letter-spacing:.01em}
*{scrollbar-width:thin;scrollbar-color:#2d3945 transparent}
*::selection{background:#214968;color:#fff}
.app{background:var(--bg)}
.side{width:244px;background:#0c131a;border-right:1px solid #202c36;padding:18px 12px;box-shadow:10px 0 24px rgba(0,0,0,.07)}
.logo{font-size:16px;font-weight:750;letter-spacing:.01em;margin:3px 10px 18px;color:#f3f6f8}
.logo span{color:var(--blue2);font-weight:700}
.enterprise-user{padding:8px 9px;margin:0 2px 14px;background:#101921;border:1px solid #202c36;border-radius:4px;color:#96a5b3}
.enterprise-user b{color:#dce4ea;font-weight:650}
.enterprise-user button{float:right;margin-top:-2px;background:transparent;border-color:#34414c;color:#aab7c2}
.enterprise-user button:hover{background:#17212a}
.nav{border-top:1px solid #1d2933;padding-top:10px}
.nav button{position:relative;padding:10px 11px;margin:1px 0;border-radius:4px;color:#8f9eab;font-size:12px;font-weight:550;letter-spacing:.01em}
.nav button:hover{background:#131d26;color:#e9eef2}
.nav button.active{background:#162430;color:#eef5f9;box-shadow:inset 2px 0 0 var(--blue)}
.nav button.active:hover{background:#162430}
.main{max-width:none;padding:24px 28px 40px;background:var(--bg)}

const DATA={"source":{"filename":"X4KISi5RTUKrOCvO32S9_55+-+Nessus-Scan-Report-Example(1).pdf","sha256":"fb2fd73f995141d2005a32e2004611bde93e5ec4d7588c5db487bab7e91aaf16"},"findings":[{"id":97833,"title":"MS17-010: Security Update for Microsoft Windows SMB Server (4013389) (ETERNALBLUE) (ETERNALCHAMPION) (ETERNALROMANCE) (ETERNALSYNERGY) (WannaCry) (EternalRocks) (Petya) (uncredentialed check) Synopsis The remote Windows host is affected by multiple vulnerabilities. Description The remote Windows host is affected by the following vulnerabilities :  - Multiple remote code execution vulnerabilities exist in Microsoft Server Message Block 1.0 (SMBv1) due to improper handling of certain requests. An unauthenticated, remote attacker can exploit these vulnerabilities, via a specially crafted packet, to execute arbitrary code. (CVE-2017-0143, CVE-2017-0144, CVE-2017-0145, CVE-2017-0146, CVE-2017-0148)  - An information disclosure vulnerability exists in Microsoft Server Message Block 1.0 (SMBv1) due to improper handling of certain requests. An unauthenticated, remote attacker can exploit this, via a specially crafted packet, to disclose sensitive information. (CVE-2017-0147)  ETERNALBLUE, ETERNALCHAMPION, ETERNALROMANCE, and ETERNALSYNERGY are four of multiple Equation Group vulnerabilities and exploits disclosed on 2017/04/14 by a group known as the Shadow Brokers. WannaCry / WannaCrypt is a ransomware program utilizing the ETERNALBLUE exploit, and EternalRocks is a worm that utilizes seven Equation Group vulnerabilities. Petya is a ransomware program that \ufb01rst utilizes CVE-2017-0199, a vulnerability in Microsoft Of\ufb01ce, and then spreads via ETERNALBLUE. See Also https://technet.microsoft.com/library/security/MS17-010 http://www.nessus.org/u?321523eb http://www.nessus.org/u?7bec1941 http://www.nessus.org/u?d9f569cf https://blogs.technet.microsoft.com/\ufb01lecab/2016/09/16/stop-using-smb1/ https://support.microsoft.com/en-us/kb/2696547 http://www.nessus.org/u?8dcab5e4 http://www.nessus.org/u?36fd3072 http://www.nessus.org/u?4c7e0cf3 https://github.com/stamparm/EternalRocks/ http://www.nessus.org/u?59db5b5b Solution Microsoft has released a set of patches for Windows Vista, 2008, 7, 2008 R2, 2012, 8.1, RT 8.1, 2012 R2, 10, and 2016. Microsoft has also released emergency patches for Windows operating systems that are no longer supported, including Windows XP, 2003, and 8.  For unsupported Windows operating systems, e.g. Windows XP, Microsoft recommends that users discontinue the use of SMBv1. SMBv1 lacks security features that were included in later   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 5/125 SMB versions. SMBv1 can be disabled by following the vendor instructions provided in Microsoft KB2696547. Additionally, US-CERT recommends that users block SMB directly by blocking TCP port 445 on all network boundary devices. For SMB over the NetBIOS API, block TCP ports 137 / 139 and UDP ports 137 / 138 on all network boundary devices. Risk Factor Critical CVSS v3.0 Base Score 9.8 (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H) CVSS v3.0 Temporal Score 8.8 (CVSS:3.0/E:P/RL:O/RC:C) CVSS Base Score 10.0 (CVSS2#AV:N/AC:L/Au:N/C:C/I:C/A:C) CVSS Temporal Score 7.8 (CVSS2#E:POC/RL:OF/RC:C) STIG Severity I References BID 96709 BID 96707 BID 96706 BID 96705 BID 96704 BID 96703 CVE CVE-2017-0148 CVE CVE-2017-0147 CVE CVE-2017-0146 CVE CVE-2017-0145 CVE CVE-2017-0144 CVE CVE-2017-0143 XREF IAVA:2017-A-0065 XREF MSFT:MS17-010 XREF EDB-ID:41987 XREF EDB-ID:41891 XREF OSVDB:155635 XREF OSVDB:155634 XREF OSVDB:155620   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 6/125 XREF OSVDB:153678 XREF OSVDB:153677 XREF OSVDB:153676 XREF OSVDB:153675 XREF OSVDB:153674 XREF OSVDB:153673 Exploitable with Core Impact (true)Metasploit (true) Plugin Information: Publication date: 2017/03/20, Modi\ufb01cation date: 2017/06/28 ion. (CVE-2017-0147) ETERNALBLUE, ETERNALCHAMPION, ETERNALROMANCE, and ETERNALSYNERGY are four of multiple Equation Group vulnerabilities and exploits disclosed on 2017/04/14 by a group known as the Shadow Brokers. WannaCry / WannaCrypt is a ransomware program utilizing the ETERNALBLUE exploit, and EternalRocks is a worm that utilizes seven Equation Group vulnerabilities. Petya is a ransomware program that \ufb01rst utilizes CVE-2017-0199, a vulnerability in Microsoft Of\ufb01ce, and then spreads via ETERNALBLUE."},{"id":53514,"title":"MS11-030: Vulnerability in DNS Resolution Could Allow Remote Code Execution (2509553) (remote check) Synopsis Arbitrary code can be executed on the remote host through the installed Windows DNS client. Description A \ufb02aw in the way the installed Windows DNS client processes Link- local Multicast Name Resolution (LLMNR) queries can be exploited to execute arbitrary code in the context of the NetworkService account.  Note that Windows XP and 2003 do not support LLMNR and successful exploitation on those platforms requires local access and the ability to run a special application. On Windows Vista, 2008, 7, and 2008 R2, however, the issue can be exploited remotely. See Also http://technet.microsoft.com/en-us/security/bulletin/ms11-030 Solution Microsoft has released a set of patches for Windows XP, 2003, Vista, 2008, 7, and 2008 R2. Risk Factor Critical CVSS Base Score 10.0 (CVSS2#AV:N/AC:L/Au:N/C:C/I:C/A:C) CVSS Temporal Score 7.8 (CVSS2#E:POC/RL:OF/RC:C) STIG Severity I References BID 47242 CVE CVE-2011-0657   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 7/125 XREF MSFT:MS11-030 XREF IAVA:2011-A-0039 XREF OSVDB:71780 Exploitable with Core Impact (true)Metasploit (true) Plugin Information: Publication date: 2011/04/21, Modi\ufb01cation date: 2014/08/29 Hosts 192.168.15.113 (udp/5355)","risk":"Critical","cvss":10.0,"cves":["CVE-2011-0657"],"hosts":[{"ip":"192.168.15.113","proto":"udp","port":5355}],"solution":"Microsoft has released a set of patches for Windows XP, 2003, Vista, 2008, 7, and 2008 R2.","synopsis":"Arbitrary code can be executed on the remote host through the installed Windows DNS client.","description":"A \ufb02aw in the way the installed Windows DNS client processes Link- local Multicast Name Resolution (LLMNR) queries can be exploited to execute arbitrary code in the context of the NetworkService account. Note that Windows XP and 2003 do not support LLMNR and successful exploitation on those platforms requires local access and the ability to run a special application. On Windows Vista, 2008, 7, and 2008 R2, however, the issue can be exploited remotely."},{"id":79638,"title":"MS14-066: Vulnerability in Schannel Could Allow Remote Code Execution (2992611) (uncredentialed check) Synopsis The remote Windows host is affected by a remote code execution vulnerability. Description The remote Windows host is affected by a remote code execution vulnerability due to improper processing of packets by the Secure Channel (Schannel) security package. An attacker can exploit this issue by sending specially crafted packets to a Windows server.  Note that this plugin sends a client Certi\ufb01cate TLS handshake message followed by a Certi\ufb01cateVerify message. Some Windows hosts will close the connection upon receiving a client certi\ufb01cate for which it did not ask for with a Certi\ufb01cateRequest message. In this case, the plugin cannot proceed to detect the vulnerability as the Certi\ufb01cateVerify message cannot be sent. See Also https://technet.microsoft.com/library/security/ms14-066 Solution Microsoft has released a set of patches for Windows 2003, Vista, 2008, 7, 2008 R2, 8, 2012, 8.1, and 2012 R2. Risk Factor Critical CVSS Base Score 10.0 (CVSS2#AV:N/AC:L/Au:N/C:C/I:C/A:C) CVSS Temporal Score 8.7 (CVSS2#E:ND/RL:OF/RC:C) References BID 70954 CVE CVE-2014-6321 XREF MSFT:MS14-066 XREF CERT:505120 XREF OSVDB:114506   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 8/125 Exploitable with Core Impact (true) Plugin Information: Publication date: 2014/12/01, Modi\ufb01cation date: 2017/06/29 Hosts 192.168.15.112 (tcp/3389)","risk":"Critical","cvss":10.0,"cves":["CVE-2014-6321"],"hosts":[{"ip":"192.168.15.112","proto":"tcp","port":3389}],"solution":"Microsoft has released a set of patches for Windows 2003, Vista, 2008, 7, 2008 R2, 8, 2012, 8.1, and 2012 R2.","synopsis":"The remote Windows host is affected by a remote code execution vulnerability.","description":"The remote Windows host is affected by a remote code execution vulnerability due to improper processing of packets by the Secure Channel (Schannel) security package. An attacker can exploit this issue by sending specially crafted packets to a Windows server. Note that this plugin sends a client Certi\ufb01cate TLS handshake message followed by a Certi\ufb01cateVerify message. Some Windows hosts will close the connection upon receiving a client certi\ufb01cate for which it did not ask for with a Certi\ufb01cateRequest message. In this case, the plugin cannot proceed to detect the vulnerability as the Certi\ufb01cateVerify message cannot be sent."},{"id":93194,"title":"OpenSSH < 7.3 Multiple Vulnerabilities Synopsis The SSH server running on the remote host is affected by multiple vulnerabilities. Description According to its banner, the version of OpenSSH running on the remote host is prior to 7.3. It is, therefore, affected by multiple vulnerabilities :  - A \ufb02aw exists that is due to the program returning shorter response times for authentication requests with overly long passwords for invalid users than for valid users. This may allow a remote attacker to conduct a timing attack and enumerate valid usernames. (CVE-2016-6210)  - A denial of service vulnerability exists in the auth_password() function in auth-passwd.c due to a failure to limit password lengths for password authentication. An unauthenticated, remote attacker can exploit this, via a long string, to consume excessive CPU resources, resulting in a denial of service condition. (CVE-2016-6515)  - An unspeci\ufb01ed \ufb02aw exists in the CBC padding oracle countermeasures that allows an unauthenticated, remote attacker to conduct a timing attack. (VulnDB 142343)  - A \ufb02aw exists due to improper operation ordering of MAC veri\ufb01cation for Encrypt-then-MAC (EtM) mode transport MAC algorithms when verifying the MAC before decrypting any ciphertext. An unauthenticated, remote attacker can exploit this, via a timing attack, to disclose sensitive information. (VulnDB 142344)  Note that Nessus has not tested for these issues but has instead relied only on the application's self-reported version number. See Also http://www.openssh.com/txt/release-7.3 https://marc.info/?l=openbsd-announce&m=147005433429403 Solution Upgrade to OpenSSH version 7.3 or later. Risk Factor High CVSS v3.0 Base Score 7.5 (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H) CVSS v3.0 Temporal Score 6.9 (CVSS:3.0/E:F/RL:O/RC:X) CVSS Base Score 7.8 (CVSS2#AV:N/AC:L/Au:N/C:N/I:N/A:C)   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 9/125 CVSS Temporal Score 6.4 (CVSS2#E:F/RL:OF/RC:ND) References BID 92212 CVE CVE-2016-6210 CVE CVE-2016-6515 XREF OSVDB:142344 XREF OSVDB:142343 XREF OSVDB:142342 XREF OSVDB:141586 Plugin Information: Publication date: 2016/08/29, Modi\ufb01cation date: 2016/12/07 Hosts 192.168.15.72 (tcp/22)   Version source : SSH2.0OpenSSH_7.2 Installed version : 7.2 Fixed version : 7.3 192.168.15.85 (tcp/22)   Version source : SSH2.0OpenSSH_5.3 Installed version : 5.3 Fixed version : 7.3","risk":"High","cvss":7.5,"cves":["CVE-2016-6210","CVE-2016-6515"],"hosts":[{"ip":"192.168.15.72","proto":"tcp","port":22}],"solution":"Upgrade to OpenSSH version 7.3 or later.","synopsis":"The SSH server running on the remote host is affected by multiple vulnerabilities.","description":"According to its banner, the version of OpenSSH running on the remote host is prior to 7.3. It is, therefore, affected by multiple vulnerabilities : - A \ufb02aw exists that is due to the program returning shorter response times for authentication requests with overly long passwords for invalid users than for valid users. This may allow a remote attacker to conduct a timing attack and enumerate valid usernames. (CVE-2016-6210) - A denial of service vulnerability exists in the auth_password() function in auth-passwd.c due to a failure to limit password lengths for password authentication. An unauthenticated, remote attacker can exploit this, via a long string, to consume excessive CPU resources, resulting in a denial of service condition. (CVE-2016-6515) - An unspeci\ufb01ed \ufb02aw exists in the CBC padding oracle countermeasures that allows an unauthenticated, remote attacker to conduct a timing attack. (VulnDB 142343) - A \ufb02aw exists due to improper operation ordering of MAC veri\ufb01cation for Encrypt-then-MAC (EtM) mode transport MAC algorithms when verifying the MAC before decrypting any ciphertext. An unauthenticated, remote attacker can exploit this, via a timing attack, to disclose sensitive information. (VulnDB 142344) Note that Nessus has not tested for these issues but has instead relied only on the application's self-reported version number."},{"id":73079,"title":"OpenSSH < 6.6 Multiple Vulnerabilities Synopsis The SSH server on the remote host is affected by multiple vulnerabilities. Description According to its banner, the version of OpenSSH running on the remote host is prior to 6.6. It is, therefore, affected by the following vulnerabilities :  - A \ufb02aw exists due to a failure to initialize certain data structures when make\ufb01le.inc is modi\ufb01ed to enable the J-PAKE protocol. An unauthenticated, remote attacker can exploit this to corrupt memory, resulting in a denial of service ufb01guration setting in sshd_con\ufb01g due to improper processing of wildcard characters. An unauthenticated, remote attacker can exploit this, via a specially crafted request, to bypass intended environment restrictions. (CVE-2014-2532) Note that Nessus has not tested for these issues but has instead relied only on the application's self-reported version number. https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 10/125"},{"id":84638,"title":"OpenSSH < 6.9 Multiple Vulnerabilities Synopsis The SSH server running on the remote host is affected by multiple vulnerabilities. Description According to its banner, the version of OpenSSH running on the remote host is prior to 6.9. It is, therefore, affected by the following vulnerabilities :  - A \ufb02aw exists within the x11_open_helper() function in the 'channels.c' \ufb01le that allows connections to be permitted after 'ForwardX11Timeout' has expired. A remote attacker can exploit this to bypass timeout checks and XSECURITY restrictions. (CVE-2015-5352)  - Various issues were addressed by \ufb01xing the weakness in agent locking by increasing the failure delay, storing the salted hash of the password, and using a timing-safe comparison function.    https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 11/125 - An out-of-bounds read error exists when handling incorrect pattern lengths. A remote attacker can exploit this to cause a denial of service or disclose sensitive information in the memory.  - An out-of-bounds read error exists when parsing the 'EscapeChar' con\ufb01guration option. See Also http://www.openssh.com/txt/release-6.9 http://www.nessus.org/u?725c4682 Solution Upgrade to OpenSSH 6.9 or later. Risk Factor High CVSS Base Score 8.5 (CVSS2#AV:N/AC:L/Au:N/C:P/I:N/A:C) CVSS Temporal Score 6.3 (CVSS2#E:U/RL:OF/RC:C) References BID 75525 CVE CVE-2015-5352 XREF OSVDB:124019 XREF OSVDB:124008 Plugin Information: Publication date: 2015/07/09, Modi\ufb01cation date: 2015/07/10 Hosts 192.168.15.85 (tcp/22)   Version source : SSH2.0OpenSSH_5.3 Installed version : 5.3 Fixed version : 6.9","risk":"High","cvss":8.5,"cves":["CVE-2015-5352"],"hosts":[{"ip":"192.168.15.85","proto":"tcp","port":22}],"solution":"Upgrade to OpenSSH 6.9 or later.","synopsis":"The SSH server running on the remote host is affected by multiple vulnerabilities.","description":"According to its banner, the version of OpenSSH running on the remote host is prior to 6.9. It is, therefore, affected by the following vulnerabilities : - A \ufb02aw exists within the x11_open_helper() function in the 'channels.c' \ufb01le that allows connections to be permitted after 'ForwardX11Timeout' has expired. A remote attacker can exploit this to bypass timeout checks and XSECURITY restrictions. (CVE-2015-5352) - Various issues were addressed by \ufb01xing the weakness in agent locking by increasing the failure delay, storing the salted hash of the password, and using a timing-safe comparison function. https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 11/125 - An out-of-bounds read error exists when handling incorrect pattern lengths. A remote attacker can exploit this to cause a denial of service or disclose sensitive information in the memory. - An out-of-bounds read error exists when parsing the 'EscapeChar' con\ufb01guration option."},{"id":85382,"title":"OpenSSH < 7.0 Multiple Vulnerabilities Synopsis The SSH server running on the remote host is affected by multiple vulnerabilities. Description According to its banner, the version of OpenSSH running on the remote host is prior to 7.0. It is, therefore, affected by the following vulnerabilities :  - A security bypass vulnerability exists in the kbdint_next_device() function in \ufb01le auth2-chall.c that allows the circumvention of MaxAuthTries during keyboard-interactive authentication. A remote attacker can exploit this issue to force the same authentication method to be tried thousands of times in a single pass by using a crafted keyboard-interactive 'devices' string, thus allowing a brute-force attack or causing a denial of service. (CVE-2015-5600)    https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 12/125 - A security bypass vulnerability exists in sshd due to improper handling of username data in MONITOR_REQ_PAM_INIT_CTX requests. A local attacker can exploit this, by sending a MONITOR_REQ_PWNAM request, to conduct an impersonation attack. Note that this issue only affects Portable OpenSSH. (CVE-2015-6563)  - A privilege escalation vulnerability exists due to a use-after-free error in sshd that is triggered when handling a MONITOR_REQ_PAM_FREE_CTX request. A local attacker can exploit this to gain elevated privileges. Note that this issue only affects Portable OpenSSH. (CVE-2015-6564)  - A local command execution vulnerability exists in sshd due to setting insecure world-writable permissions for TTYs. A local attacker can exploit this, by injecting crafted terminal escape sequences, to execute commands for logged-in users. (CVE-2015-6565) See Also http://www.openssh.com/txt/release-7.0 Solution Upgrade to OpenSSH 7.0 or later. Risk Factor High CVSS v3.0 Base Score 6.1 (CVSS:3.0/AV:L/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:H) CVSS v3.0 Temporal Score 5.6 (CVSS:3.0/E:F/RL:O/RC:X) CVSS Base Score 8.5 (CVSS2#AV:N/AC:L/Au:N/C:P/I:N/A:C) CVSS Temporal Score 7.0 (CVSS2#E:F/RL:OF/RC:ND) References BID 76497 BID 76317 BID 75990 CVE CVE-2015-6565 CVE CVE-2015-6564 CVE CVE-2015-6563 CVE CVE-2015-5600 XREF EDB-ID:41173 XREF OSVDB:126033 XREF OSVDB:126031 XREF OSVDB:126030   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 13/125 XREF OSVDB:124938 Plugin Information: Publication date: 2015/08/13, Modi\ufb01cation date: 2017/04/05 Hosts 192.168.15.85 (tcp/22)   Version source : SSH2.0OpenSSH_5.3 Installed version : 5.3 Fixed version : 7.0","risk":"High","cvss":6.1,"cves":["CVE-2015-5600","CVE-2015-6563","CVE-2015-6564","CVE-2015-6565"],"hosts":[{"ip":"192.168.15.85","proto":"tcp","port":22}],"solution":"Upgrade to OpenSSH 7.0 or later.","synopsis":"The SSH server running on the remote host is affected by multiple vulnerabilities.","description":"According to its banner, the version of OpenSSH running on the remote host is prior to 7.0. It is, therefore, affected by the following vulnerabilities : - A security bypass vulnerability exists in the kbdint_next_device() function in \ufb01le auth2-chall.c that allows the circumvention of MaxAuthTries during keyboard-interactive authentication. A remote attacker can exploit this issue to force the same authentication method to be tried thousands of times in a single pass by using a crafted keyboard-interactive 'devices' string, thus allowing a brute-force attack or causing a denial of service. (CVE-2015-5600) https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 12/125 - A security bypass vulnerability exists in sshd due to improper handling of username data in MONITOR_REQ_PAM_INIT_CTX requests. A local attacker can exploit this, by sending a MONITOR_REQ_PWNAM request, to conduct an impersonation attack. Note that this issue only affects Portable OpenSSH. (CVE-2015-6563) - A privilege escalation vulnerability exists due to a use-after-free error in sshd that is triggered when handling a MONITOR_REQ_PAM_FREE_CTX request. A local attacker can exploit this to gain elevated privileges. Note that this issue only affects Portable OpenSSH. (CVE-2015-6564) - A local command execution vulnerability exists in sshd due to setting insecure world-writable permissions for TTYs. A local attacker can exploit this, by injecting crafted terminal escape sequences, to execute commands for logged-in users. (CVE-2015-6565)"},{"id":51192,"title":"SSL Certi\ufb01cate Cannot Be Trusted Synopsis The SSL certi\ufb01cate for this service cannot be trusted. Description The server's X.509 certi\ufb01cate cannot be trusted. This situation can occur in three different ways, in which the chain of trust can be broken, as stated below :  - First, the top of the certi\ufb01cate chain sent by the server might not be descended from a known public certi\ufb01cate authority. This can occur either when the top of the chain is an unrecognized, self-signed certi\ufb01cate, or when intermediate certi\ufb01cates are missing that would connect the top of the certi\ufb01cate chain to a known public certi\ufb01cate authority.  - Second, the certi\ufb01cate chain may contain a certi\ufb01cate that is not valid at the time of the scan. This can occur either when the scan occurs before one of the certi\ufb01cate's 'notBefore' dates, or after one of the certi\ufb01cate's 'notAfter' dates.  - Third, the certi\ufb01cate chain may contain a signature that either didn't match the certi\ufb01cate's information or could not be veri\ufb01ed. Bad signatures can be \ufb01xed by getting the certi\ufb01cate with the bad signature to be re-signed by its issuer. Signatures that could not be veri\ufb01ed are the result of the certi\ufb01cate's issuer using a signing algorithm that Nessus either does not support or does not recognize.  If the remote host is a public host in production, any break in the chain makes it more dif\ufb01cult for users to verify the authenticity and identity of the web server. This could make it easier to carry out man-in-the-middle attacks against the remote host. See Also http://www.itu.int/rec/T-REC-X.509/en https://en.wikipedia.org/wiki/X.509 Solution Purchase or generate a proper certi\ufb01cate for this service. Risk Factor Medium CVSS v3.0 Base Score 6.5 (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N) CVSS Base Score 6.4 (CVSS2#AV:N/AC:L/Au:N/C:P/I:P/A:N) Plugin Information:   https://static.tenable.com/do time of the scan. This can occur either when the scan occurs before one of the certi\ufb01cate's 'notBefore' dates, or after one of the certi\ufb01cate's 'notAfter' dates. - Third, the certi\ufb01cate chain may contain a signature that either didn't match the certi\ufb01cate's information or could not be veri\ufb01ed. Bad signatures can be \ufb01xed by getting the certi\ufb01cate with the bad signature to be re-signed by its issuer. Signatures that could not be veri\ufb01ed are the result of the certi\ufb01cate's issuer using a signing algorithm that Nessus either does not support or does not recognize. If the remote host is a public host in production, any break in the chain makes it more dif\ufb01cult for users to verify the authenticity and identity of the web server. This could make it easier to carry out man-in-the-middle attacks against the remote host."},{"id":57582,"title":"SSL Self-Signed Certi\ufb01cate Synopsis The SSL certi\ufb01cate chain for this service ends in an unrecognized self-signed certi\ufb01cate. Description The X.509 certi\ufb01cate chain for this service is not signed by a recognized certi\ufb01cate authority. If the remote host is a public host in production, this nulli\ufb01es the use of SSL as anyone could establish a man-in-the-middle attack against the remote host.  Note that this plugin does not check for certi\ufb01cate chains that end in a certi\ufb01cate that is not self-signed, but is signed by an unrecognized certi\ufb01cate authority. Solution Purchase or generate a proper certi\ufb01cate for this service. Risk Factor Medium CVSS Base Score 6.4 (CVSS2#AV:N/AC:L/Au:N/C:P/I:P/A:N) Plugin Information: Publication date: 2012/01/17, Modi\ufb01cation date: 2016/12/14 Hosts 192.168.15.43 (tcp/9090)   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 15/125   The following certificate was found at the top of the certificate chain sent by the remote host, but is selfsigned and erence options, which will be removed by default in a future release. (VulnDB 144000) Note that Nessus has not tested for these issues but has instead relied only on the application's self-reported version number."},{"id":35291,"title":"SSL Certi\ufb01cate Signed Using Weak Hashing Algorithm Synopsis An SSL certi\ufb01cate in the certi\ufb01cate chain has been signed using a weak hash algorithm. Description The remote service uses an SSL certi\ufb01cate chain that has been signed using a cryptographically weak hashing algorithm (e.g. MD2, MD4, MD5, or SHA1). These signature algorithms are known to be vulnerable to collision attacks. An attacker can exploit this to generate another certi\ufb01cate with the same digital signature, allowing an attacker to masquerade as the affected service.  Note that this plugin reports all SSL certi\ufb01cate chains signed with SHA-1 that expire after January 1, 2017 as vulnerable. This is in accordance with Google's gradual sunsetting of the SHA-1 cryptographic hash algorithm.  Note that certi\ufb01cates in the chain that are contained in the Nessus CA database (known_CA.inc) have been ignored. See Also https://tools.ietf.org/html/rfc3279 http://www.nessus.org/u?e120eea1   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 17/125 http://technet.microsoft.com/en-us/security/advisory/961509 Solution Contact the Certi\ufb01cate Authority to have the certi\ufb01cate reissued. Risk Factor Medium CVSS Base Score 4.0 (CVSS2#AV:N/AC:H/Au:N/C:P/I:P/A:N) CVSS Temporal Score 3.5 (CVSS2#E:ND/RL:OF/RC:C) References BID 33065 BID 11849 CVE CVE-2004-2761 XREF CWE:310 XREF CERT:836068 XREF OSVDB:45127 XREF OSVDB:45108 XREF OSVDB:45106 Plugin Information: Publication date: 2009/01/05, Modi\ufb01cation date: 2017/06/12 Hosts 192.168.15.112 (tcp/3389)   The following certificates were part of the certificate chain sent by the remote host, but contain hashes that are considered to be weak.  | th as any encryption that uses key lengths at least 64 bits and less than 112 bits, or else that uses the 3DES encryption suite.  Note that it is considerably easier to circumvent medium strength encryption if the attacker is on the same physical network. See Also https://www.openssl.org/blog/blog/2016/08/24/sweet32/ Solution Recon\ufb01gure the affected application if possible to avoid use of medium strength ciphers. Risk Factor Medium CVSS v3.0 Base Score 5.3 (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N) CVSS Base Score 5.0 (CVSS2#AV:N/AC:L/Au:N/C:P/I:N/A:N) Plugin Information: Publication date: 2009/11/23, Modi\ufb01cation date: 2017/06/29 Hosts 192.168.15.112 (tcp/3389)   Here is the list of medium strength SSL ciphers supported by the re mote server :  Medium Strength Ciphers (> 64bit and < 112bit key, or 3DES)  TLSv1 DESCBC3SHA Kx=RSA Au=RSA Enc=3DESCBC(168) Mac=SHA1    TLSv11 DESCBC3SHA Kx=RSA Au=RSA Enc=3DESCBC(168) Mac=SHA1    TLSv12 DESCBC3SHA Kx=RSA Au=RSA Enc=3DESCBC(168) Mac=SHA1    The fields above are :  {OpenSSL ciphername} Kx={key exchange} Au={authentication} Enc={symmetric encryption method} Mac={message authentication code} {export flag} 192.168.15.113 (tcp/3389)   Here is the list of medium strength SSL ciphers supported by the re mote server :    https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 19/125 Medium Strength Ciphers (> 64bit and < 112bit key, or 3DES)  TLSv1 DESCBC3SHA Kx=RSA Au=RSA Enc=3DESCBC(168) Mac=SHA1    The fields above are :  {OpenSSL ciphername} Kx={key exchange} Au={authentication} Enc={symmetric encryption method} Mac={message authentication code} {export flag}","risk":"Medium","cvss":5.3,"cves":[],"hosts":[{"ip":"192.168.15.112","proto":"tcp","port":3389}],"solution":"Recon\ufb01gure the affected application if possible to avoid use of medium strength ciphers.","synopsis":"The remote service supports the use of medium strength SSL ciphers.","description":"The  remote attacker can exploit this to conduct man-in-the-middle attacks against the SMB server."},{"id":90023,"title":"OpenSSH < 7.2p2 X11Forwarding xauth Command Injection Synopsis The SSH server running on the remote host is affected by a security bypass vulnerability. Description   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 20/125 According to its banner, the version of OpenSSH running on the remote host is prior to 7.2p2. It is, therefore, affected by a security bypass vulnerability due to improper sanitization of X11 authentication credentials. An authenticated, remote attacker can exploit this, via crafted credentials, to inject arbitrary xauth commands, resulting in gaining read and write access to arbitrary \ufb01les, connecting to local ports, or performing further attacks on xauth itself. Note that exploiting this vulnerability requires X11Forwarding to have been enabled. See Also http://www.openssh.com/txt/release-7.2p2 http://www.openssh.com/txt/x11fwd.adv Solution Upgrade to OpenSSH version 7.2p2 or later. Risk Factor Medium CVSS Base Score 4.9 (CVSS2#AV:N/AC:M/Au:S/C:P/I:P/A:N) CVSS Temporal Score 4.0 (CVSS2#E:F/RL:OF/RC:ND) References CVE CVE-2016-3115 XREF EDB-ID:39569 XREF OSVDB:135714 Plugin Information: Publication date: 2016/03/18, Modi\ufb01cation date: 2016/09/01 Hosts 192.168.15.72 (tcp/22)   Version source : SSH2.0OpenSSH_7.2 Installed version : 7.2 Fixed version : 7.2p2 192.168.15.85 (tcp/22)   Version source : SSH2.0OpenSSH_5.3 Installed version : 5.3 Fixed version : 7.2p2","risk":"Medium","cvss":4.9,"cves":["CVE-2016-3115"],"hosts":[{"ip":"192.168.15.72","proto":"tcp","port":22}],"solution":"Upgrade to OpenSSH version 7.2p2 or later.","synopsis":"The SSH server running on the remote host is affected by a security bypass vulnerability.","description":"https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 20/125 According to its banner, the version of OpenSSH running on the remote host is prior to 7.2p2. It is, therefore, affected by a security bypass vulnerability due to improper sanitization of X11 authentication credentials. An authenticated, remote attacker can exploit this, via crafted credentials, to inject arbitrary xauth commands, resulting in gaining read and write access to arbitrary \ufb01les, connecting to local ports, or performing further attacks on xauth itself. Note that exploiting this vulnerability requires X11Forwarding to have been enabled."},{"id":90510,"title":"MS16-047: Security Update for SAM and LSAD Remote Protocols (3148527) (Badlock) (uncredentialed check) Synopsis The remote Windows host is affected by an elevation of privilege vulnerability. Description The remote Windows host is affected by an elevation of privilege vulnerability in the Security Account Manager (SAM) and Local Security Authority (Domain Policy) (LSAD) protocols due to improper authentication level negotiation over Remote Procedure Call (RPC) channels. A   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 21/125 man-in-the-middle attacker able to intercept communications between a client and a server hosting a SAM database can exploit this to force the authentication level to downgrade, allowing the attacker to impersonate an authenticated user and access the SAM database. See Also https://technet.microsoft.com/library/security/MS16-047 http://badlock.org/ Solution Microsoft has released a set of patches for Windows Vista, 2008, 7, 2008 R2, 2012, 8.1, RT 8.1, 2012 R2, and 10. Risk Factor Medium CVSS Base Score 6.8 (CVSS2#AV:N/AC:M/Au:N/C:P/I:P/A:P) CVSS Temporal Score 5.6 (CVSS2#E:F/RL:OF/RC:ND) STIG Severity I References BID 86002 CVE CVE-2016-0128 XREF IAVA:2016-A-0093 XREF CERT:813296 XREF MSFT:MS16-047 XREF OSVDB:136339 Plugin Information: Publication date: 2016/04/13, Modi\ufb01cation date: 2016/07/19 Hosts 192.168.15.112 (tcp/49154) 192.168.15.113 (tcp/49193)","risk":"Medium","cvss":6.8,"cves":["CVE-2016-0128"],"hosts":[{"ip":"192.168.15.112","proto":"tcp","port":49154},{"ip":"192.168.15.113","proto":"tcp","port":49193}],"solution":"Microsoft has released a set of patches for Windows Vista, 2008, 7, 2008 R2, 2012, 8.1, RT 8.1, 2012 R2, and 10.","synopsis":"The remote Windows host is affected by an elevation of privilege vulnerability.","description":"The remote Windows host is affected by an elevation of privilege vulnerability in the Security Account Manager (SAM) and Local Security Authority (Domain Policy) (LSAD) protocols due to improper authentication level negotiation over Remote Procedure Call (RPC) channels. A https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 21/125 man-in-the-middle attacker able to intercept communications between a client and a server hosting a SAM database can exploit this to force the authentication level to downgrade, allowing the attacker to impersonate an authenticated user and access the SAM database."},{"id":94437,"title":"SSL 64-bit Block Size Cipher Suites Supported (SWEET32) Synopsis The remote service supports the use of 64-bit block ciphers. Description The remote host supports the use of a block cipher with 64-bit blocks in one or more cipher suites. It is, therefore, affected by a vulnerability, known as SWEET32, due to the use of weak 64-bit block ciphers. A man-in-the-middle attacker who has suf\ufb01cient resources can exploit this vulnerability, via a 'birthday' attack, to detect a collision that leaks the XOR between the \ufb01xed secret and a known plaintext, allowing the disclosure of the secret text, such as secure HTTPS cookies, and possibly resulting in the hijacking of an authenticated session.    https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 22/125 Proof-of-concepts have shown that attackers can recover authentication cookies from an HTTPS session in as little as 30 hours.  Note that the ability to send a large number of requests over the same TLS connection between the client and server is an important requirement for carrying out this attack. If the number of requests allowed for a single connection were limited, this would mitigate the vulnerability. However, Nessus has not checked for such a mitigation. See Also https://sweet32.info https://www.openssl.org/blog/blog/2016/08/24/sweet32/ Solution Recon\ufb01gure the affected application, if possible, to avoid use of all 64-bit block ciphers. Alternatively, place limitations on the number of requests that are allowed to be processed over the same TLS connection to mitigate this vulnerability. Risk Factor Medium CVSS v3.0 Base Score 5.3 (CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N) CVSS v3.0 Temporal Score 5.1 (CVSS:3.0/E:F/RL:X/RC:X) CVSS Base Score 5.0 (CVSS2#AV:N/AC:L/Au:N/C:P/I:N/A:N) CVSS Temporal Score 4.8 (CVSS2#E:F/RL:ND/RC:ND) References BID 92631 BID 92630 CVE CVE-2016-6329 CVE CVE-2016-2183 XREF OSVDB:143388 XREF OSVDB:143387 Plugin Information: Publication date: 2016/11/01, Modi\ufb01cation date: 2017/01/24 Hosts 192.168.15.112 (tcp/3389)   List of 64bit block cipher suites supported by the remote server :  Medium Strength Ciphers (> 64bit and < 112bit key, or 3DES)  TLSv1 DESCBC3SHA Kx=RSA Au=RSA Enc=3DESCBC(168) Mac=SHA1      https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 23/125 The fields above are :  {OpenSSL ciphername} Kx={key exchange} Au={authentication} Enc={symmetric encryption method} Mac={message authentication code} {export flag} 192.168.15.113 (tcp/3389)   List of 64bit block cipher suites supported by the remote server :  Medium Strength Ciphers (> 64bit and < 112bit key, or 3DES)  TLSv1 DESCBC3SHA Kx=RSA Au=RSA Enc=3DESCBC(168) Mac=SHA1    The fields above are :  {OpenSSL ciphername} Kx={key exchange} Au={authentication} Enc={symmetric encryption method} Mac={message authentication code} {export flag}","risk":"Medium","cvss":5.3,"cves":["CVE-2016-2183","CVE-2016-6329"],"hosts":[{"ip":"192.168.15.112","proto":"tcp","port":3389}],"solution":"Recon\ufb01gure the affected application, if possible, to avoid use of all 64-bit block ciphers. Alternatively, place limitations on the number of requests that are allowed to be processed over the same TLS connection to mitigate this vulnerability.","synopsis":"The remote service supports the use of 64-bit block ciphers.","description":"The remote host supports the use of a block cipher with 64-bit blocks in one or more cipher suites. It is, therefore, affected by a vulnerability, known as SWEET32, due to the use of weak 64-bit block ciphers. A man-in-the-middle attacker who has suf\ufb01cient resources can exploit this vulnerability, via a 'birthday' attack, to detect a collision that leaks the XOR between the \ufb01xed secret and a known plaintext, allowing the disclosure of the secret text, such as secure HTTPS cookies, and possibly resulting in the hijacking of an authenticated session. https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 22/125 Proof-of-concepts have shown that attackers can recover authentication cookies from an HTTPS session in as little as 30 hours. Note that the ability to send a large number of requests over the same TLS connection between the client and server is an important requirement for carrying out this attack. If the number of requests allowed for a single connection were limited, this would mitigate the vulnerability. However, Nessus has not checked for such a mitigation."},{"id":96151,"title":"OpenSSH < 7.4 Multiple Vulnerabilities Synopsis The SSH server running on the remote host is affected by multiple vulnerabilities. Description According to its banner, the version of OpenSSH running on the remote host is prior to 7.4. It is, therefore, affected by multiple vulnerabilities :  - A \ufb02aw exists in ssh-agent due to loading PKCS#11 modules from paths that are outside a trusted whitelist. A local attacker can exploit this, by using a crafted request to load hostile modules via agent forwarding, to execute arbitrary code. To exploit this vulnerability, the attacker would need to control the forwarded agent-socket (on the host running the sshd server) and the ability to write to the \ufb01le system of the host running ssh-agent. (CVE-2016-10009)  - A \ufb02aw exists in sshd due to creating forwarded Unix-domain sockets with 'root' privileges whenever privilege separation is disabled. A local attacker can exploit this to gain elevated privileges. (CVE-2016-10010)  - An information disclosure vulnerability exists in sshd within the realloc() function due leakage of key material to privilege-separated child processes when reading keys. A local attacker can possibly exploit this to disclose sensitive key material. Note that no such leak has been observed in practice for normal-sized keys, nor does a leak to the child processes directly expose key material to unprivileged users. (CVE-2016-10011)  - A \ufb02aw exists in sshd within the shared memory manager used by pre-authenticating compression support due to a bounds check being elided by some optimizing compilers and due to the memory manager being incorrectly accessible when pre-authenticating   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 24/125 compression is disabled. A local attacker can exploit this to gain elevated privileges. (CVE- 2016-10012)  - A denial of service vulnerability exists in sshd when handling KEXINIT messages. An unauthenticated, remote attacker can exploit this, by sending multiple KEXINIT messages, to consume up to 128MB per connection. (VulnDB 148976)  - A \ufb02aw exists in sshd due to improper validation of address ranges by the AllowUser and DenyUsers directives at con\ufb01guration load time. A local attacker can exploit this, via an invalid CIDR address range, to gain access to restricted areas. (VulnDB 148977)  Note that Nessus has not tested for these issues but has instead relied only on the application's self-reported version number. See Also http://www.openssh.com/txt/release-7.4 Solution Upgrade to OpenSSH version 7.4 or later. Risk Factor Medium CVSS v3.0 Base Score 7.0 (CVSS:3.0/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H) CVSS v3.0 Temporal Score 6.4 (CVSS:3.0/E:F/RL:O/RC:X) CVSS Base Score 6.9 (CVSS2#AV:L/AC:M/Au:N/C:C/I:C/A:C) CVSS Temporal Score 5.7 (CVSS2#E:F/RL:OF/RC:ND) References BID 94977 BID 94975 BID 94972 BID 94968 CVE CVE-2016-10012 CVE CVE-2016-10011 CVE CVE-2016-10010 CVE CVE-2016-10009 XREF EDB-ID:40962 XREF OSVDB:148977 XREF OSVDB:148976   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 25/125 XREF OSVDB:148975 XREF OSVDB:148968 XREF OSVDB:148967 XREF OSVDB:148966 Plugin Information: Publication date: 2016/12/27, Modi\ufb01cation date: 2016/12/29 Hosts 192.168.15.72 (tcp/22)   Version source : SSH2.0OpenSSH_7.2 Installed version : 7.2 Fixed version : 7.4 192.168.15.85 (tcp/22)   Version source : SSH2.0OpenSSH_5.3 Installed version : 5.3 Fixed version : 7.4","risk":"Medium","cvss":7.0,"cves":["CVE-2016-10009","CVE-2016-10010","CVE-2016-10011","CVE-2016-10012"],"hosts":[{"ip":"192.168.15.72","proto":"tcp","port":22}],"solution":"Upgrade to OpenSSH version 7.4 or later.","synopsis":"The SSH server running on the remote host is affected by multiple vulnerabilities.","description":"According to its banner, the version of OpenSSH running on the remote host is prior to 7.4. It is, therefore, affected by multiple vulnerabilities : - A \ufb02aw exists in ssh-agent due to loading PKCS#11 modules from paths that are outside a trusted whitelist. A local attacker can exploit this, by using a crafted request to load hostile modules via agent forwarding, to execute arbitrary code. To exploit this vulnerability, the attacker would need to control the forwarded agent-socket (on the host running the sshd server) and the ability to write to the \ufb01le system of the host running ssh-agent. (CVE-2016-10009) - A \ufb02aw exists in sshd due to creating forwarded Unix-domain sockets with 'root' privileges whenever privilege separation is disabled. A local attacker can exploit this to gain elevated privileges. (CVE-2016-10010) - An information disclosure vulnerability exists in sshd within the realloc() function due leakage of key material to privilege-separated child processes when reading keys. A local attacker can possibly exploit this to disclose sensitive key material. Note that no such leak has been observed in practice for normal-sized keys, nor does a leak to the child processes directly expose key material to unprivileged users. (CVE-2016-10011) - A \ufb02aw exists in sshd within the shared memory manager used by pre-authenticating compression support due to a bounds check being elided by some optimizing compilers and due to the memory manager being incorrectly accessible when pre-authenticating https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 24/125 compression is disabled. A local attacker can exploit this to gain elevated privileges. (CVE- 2016-10012) - A denial of service vulnerability exists in sshd when handling KEXINIT messages. An unauthenticated, remote attacker can exploit this, by sending multiple KEXINIT messages, to consume up to 128MB per connection. (VulnDB 148976) - A \ufb02aw exists in sshd due to improper validation of address ranges by the AllowUser and DenyUsers directives at con\ufb01guration load time. A local attacker can exploit this, via an invalid CIDR address range, to gain access to restricted areas. (VulnDB 148977) Note that Nessus has not tested for these issues but has instead relied only on the application's self-reported version number."},{"id":44081,"title":"OpenSSH < 5.7 Multiple Vulnerabilities Synopsis The remote SSH service may be affected by multiple vulnerabilities. Description According to its banner, the version of OpenSSH running on the remote host is earlier than 5.7. Versions before 5.7 may be affected by the following vulnerabilities :  - A security bypass vulnerability because OpenSSH does not properly validate the public parameters in the J-PAKE protocol. This could allow an attacker to authenticate without the shared secret. Note that this issue is only exploitable when OpenSSH is built with J-PAKE support, which is currently experimental and disabled by default, and that Nessus has not checked whether J-PAKE support is indeed enabled. (CVE-2010-4478)  - The auth_parse_options function in auth-options.c in sshd provides debug messages containing authorized_keys command options, which allows remote, authenticated users to obtain potentially sensitive information by reading these messages. (CVE-2012-0814) See Also http://seb.dbzteam.org/crypto/jpake-session-key-retrieval.pdf http://www.openbsd.org/cgi-bin/cvsweb/src/usr.bin/ssh/jpake.c#rev1.5 http://www.nessus.org/u?3f1722f0 Solution Upgrade to OpenSSH 5.7 or later. Risk Factor Medium CVSS Base Score   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 26/125 6.8 (CVSS2#AV:N/AC:M/Au:N/C:P/I:P/A:P) CVSS Temporal Score 5.9 (CVSS2#E:ND/RL:OF/RC:C) References BID 51702 BID 45304 CVE CVE-2012-0814 CVE CVE-2010-4478 XREF OSVDB:78706 XREF OSVDB:69658 Plugin Information: Publication date: 2011/10/04, Modi\ufb01cation date: 2016/12/07 Hosts 192.168.15.85 (tcp/22)   Version source : SSH2.0OpenSSH_5.3 Installed version : 5.3 Fixed version : 5.7","risk":"Medium","cvss":null,"cves":["CVE-2010-4478","CVE-2012-0814"],"hosts":[{"ip":"192.168.15.85","proto":"tcp","port":22}],"solution":"Upgrade to OpenSSH 5.7 or later.","synopsis":"The remote SSH service may be affected by multiple vulnerabilities.","description":"According to its banner, the version of OpenSSH running on the remote host is earlier than 5.7. Versions before 5.7 may be affected by the following vulnerabilities : - A security bypass vulnerability because OpenSSH does not properly validate the public parameters in the J-PAKE protocol. This could allow an attacker to authenticate without the shared secret. Note that this issue is only exploitable when OpenSSH is built with J-PAKE support, which is currently experimental and disabled by default, and that Nessus has not checked whether J-PAKE support is indeed enabled. (CVE-2010-4478) - The auth_parse_options function in auth-options.c in sshd provides debug messages containing authorized_keys command options, which allows remote, authenticated users to obtain potentially sensitive information by reading these messages. (CVE-2012-0814)"},{"id":67140,"title":"OpenSSH LoginGraceTime / MaxStartups DoS Synopsis The remote SSH service is susceptible to a remote denial of service attack. Description According to its banner, a version of OpenSSH earlier than version 6.2 is listening on this port. The default con\ufb01guration of OpenSSH installs before 6.2 could allow a remote attacker to bypass the LoginGraceTime and MaxStartups thresholds by periodically making a large number of new TCP connections and thereby prevent legitimate users from gaining access to the service.  Note that this plugin has not tried to exploit the issue or detect whether the remote service uses a vulnerable con\ufb01guration. Instead, it has simply checked the version of OpenSSH running on the remote host. See Also http://www.openwall.com/lists/oss-security/2013/02/06/5 http://openssh.org/txt/release-6.2 https://tools.cisco.com/security/center/viewAlert.x?alertId=28883 Solution Upgrade to OpenSSH 6.2 and review the associated server con\ufb01guration settings. Risk Factor Medium CVSS Base Score   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 27/125 5.0 (CVSS2#AV:N/AC:L/Au:N/C:N/I:N/A:P) CVSS Temporal Score 4.3 (CVSS2#E:ND/RL:OF/RC:C) References BID 58162 CVE CVE-2010-5107 XREF OSVDB:90007 Plugin Information: Publication date: 2013/07/03, Modi\ufb01cation date: 2017/06/12 Hosts 192.168.15.85 (tcp/22)   Version source : SSH2.0OpenSSH_5.3 Installed version : 5.3 Fixed version : 6.2","risk":"Medium","cvss":null,"cves":["CVE-2010-5107"],"hosts":[{"ip":"192.168.15.85","proto":"tcp","port":22}],"solution":"Upgrade to OpenSSH 6.2 and review the associated server con\ufb01guration settings.","synopsis":"The remote SSH service is susceptible to a remote denial of service attack.","description":"According to its banner, a version of OpenSSH earlier than version 6.2 is listening on this port. The default con\ufb01guration of OpenSSH installs before 6.2 could allow a remote attacker to bypass the LoginGraceTime and MaxStartups thresholds by periodically making a large number of new TCP connections and thereby prevent legitimate users from gaining access to the service. Note that this plugin has not tried to exploit the issue or detect whether the remote service uses a vulnerable con\ufb01guration. Instead, it has simply checked the version of OpenSSH running on the remote host."},{"id":90022,"title":"OpenSSH < 7.2 Untrusted X11 Forwarding Fallback Security Bypass Synopsis The SSH server running on the remote host is affected by a security bypass vulnerability. Description According to its banner, the version of OpenSSH running on the remote host is prior to 7.2. It is, therefore, affected by a security bypass vulnerability due to a \ufb02aw in ssh(1) that is triggered when it falls back from untrusted X11 forwarding to trusted forwarding when the SECURITY extension is disabled by the X server. This can result in untrusted X11 connections that can be exploited by a remote attacker. See Also http://www.openssh.com/txt/release-7.2 Solution Upgrade to OpenSSH version 7.2 or later. Risk Factor Medium CVSS Base Score 4.3 (CVSS2#AV:N/AC:M/Au:N/C:N/I:P/A:N) CVSS Temporal Score 3.2 (CVSS2#E:U/RL:OF/RC:C) References XREF OSVDB:135128 Plugin Information: Publication date: 2016/03/18, Modi\ufb01cation date: 2016/04/28 Hosts 192.168.15.85 (tcp/22)   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 28/125   Version source : SSH2.0OpenSSH_5.3 Installed version : 5.3 Fixed version : 7.2","risk":"Medium","cvss":4.3,"cves":[],"hosts":[{"ip":"192.168.15.85","proto":"tcp","port":22}],"solution":"Upgrade to OpenSSH version 7.2 or later.","synopsis":"The SSH server running on the remote host is affected by a security bypass vulnerability.","description":"According to its banner, the version of OpenSSH running on the remote host is prior to 7.2. It is, therefore, affected by a security bypass vulnerability due to a \ufb02aw in ssh(1) that is triggered when it falls back from untrusted X11 forwarding to trusted forwarding when the SECURITY extension is disabled by the X server. This can result in untrusted X11 connections that can be exploited by a remote attacker."},{"id":90317,"title":"SSH Weak Algorithms Supported Synopsis The remote SSH server is con\ufb01gured to allow weak encryption algorithms or no algorithm at all. Description Nessus has detected that the remote SSH server is con\ufb01gured to use the Arcfour stream cipher or no cipher at all. RFC 4253 advises against using Arcfour due to an issue with weak keys. See Also https://tools.ietf.org/html/rfc4253#section-6.3 Solution Contact the vendor or consult product documentation to remove the weak ciphers. Risk Factor Medium CVSS Base Score 4.3 (CVSS2#AV:N/AC:M/Au:N/C:P/I:N/A:N) Plugin Information: Publication date: 2016/04/04, Modi\ufb01cation date: 2016/12/14 Hosts 192.168.15.85 (tcp/22)   The following weak servertoclient encryption algorithms are suppo rted :  arcfour arcfour128 arcfour256  The following weak clienttoserver encryption algorithms are suppo rted :  arcfour arcfour128 arcfour256","risk":"Medium","cvss":4.3,"cves":[],"hosts":[{"ip":"192.168.15.85","proto":"tcp","port":22}],"solution":"Contact the vendor or consult product documentation to remove the weak ciphers.","synopsis":"The remote SSH server is con\ufb01gured to allow weak encryption algorithms or no algorithm at all.","description":"Nessus has detected that the remote SSH server is con\ufb01gured to use the Arcfour stream cipher or no cipher at all. RFC 4253 advises against using Arcfour due to an issue with weak keys."},{"id":65821,"title":"SSL RC4 Cipher Suites Supported (Bar Mitzvah) Synopsis The remote service supports the use of the RC4 cipher. Description The remote host supports the use of RC4 in one or more cipher suites. The RC4 cipher is \ufb02awed in its generation of a pseudo-random stream of bytes so that a wide variety of small biases are introduced into the stream, decreasing its randomness.    https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 29/125 If plaintext is repeatedly encrypted (e.g., HTTP cookies), and an attacker is able to obtain many (i.e., tens of millions) ciphertexts, the attacker may be able to derive the plaintext. See Also http://www.nessus.org/u?217a3666 http://cr.yp.to/talks/2013.03.12/slides.pdf http://www.isg.rhul.ac.uk/tls/ http://www.imperva.com/docs/HII_Attacking_SSL_when_using_RC4.pdf Solution Recon\ufb01gure the affected application, if possible, to avoid use of RC4 ciphers. Consider using TLS 1.2 with AES-GCM suites subject to browser and web server support. Risk Factor Low CVSS Base Score 2.6 (CVSS2#AV:N/AC:H/Au:N/C:P/I:N/A:N) CVSS Temporal Score 2.2 (CVSS2#E:F/RL:TF/RC:ND) References BID 73684 BID 58796 CVE CVE-2015-2808 CVE CVE-2013-2566 XREF OSVDB:117855 XREF OSVDB:91162 Plugin Information: Publication date: 2013/04/05, Modi\ufb01cation date: 2016/12/14 Hosts 192.168.15.112 (tcp/3389)   List of RC4 cipher suites supported by the remote server :  High Strength Ciphers (>= 112bit key)  TLSv1 RC4SHA Kx=RSA Au=RSA Enc=RC4(128) Mac=SHA1  RC4MD5 Kx=RSA Au=RSA Enc=RC4(128) Mac=MD5    The fields above are :  {OpenSSL ciphername} Kx={key exchange} Au={authentication} Enc={symmetric encryption method} Mac={message authentication code} {export flag}   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 30/125 192.168.15.113 (tcp/3389)   List of RC4 cipher suites supported by the remote server :  High Strength Ciphers (>= 112bit key)  TLSv1 RC4SHA Kx=RSA Au=RSA Enc=RC4(128) Mac=SHA1  RC4MD5 Kx=RSA Au=RSA Enc=RC4(128) Mac=MD5    The fields above are :  {OpenSSL ciphername} Kx={key exchange} Au={authentication} Enc={symmetric encryption method} Mac={message authentication code} {export flag}","risk":"Low","cvss":2.6,"cves":["CVE-2013-2566","CVE-2015-2808"],"hosts":[{"ip":"192.168.15.112","proto":"tcp","port":3389}],"solution":"Recon\ufb01gure the affected application, if possible, to avoid use of RC4 ciphers. Consider using TLS 1.2 with AES-GCM suites subject to browser and web server support.","synopsis":"The remote service supports the use of the RC4 cipher.","description":"The remote host supports the use of RC4 in one or more cipher suites. The RC4 cipher is \ufb02awed in its generation of a pseudo-random stream of bytes so that a wide variety of small biases are introduced into the stream, decreasing its randomness. https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 29/125 If plaintext is repeatedly encrypted (e.g., HTTP cookies), and an attacker is able to obtain many (i.e., tens of millions) ciphertexts, the attacker may be able to derive the plaintext."},{"id":53841,"title":"Portable OpenSSH ssh-keysign ssh-rand-helper Utility File Descriptor Leak Local Information Disclosure Synopsis Local attackers may be able to access sensitive information. Description Acc fb01nd the shared secret in a short amount of time (depending on modulus size and attacker resources). This allows an attacker to recover the plaintext or potentially violate the integrity of connections. See Also http://weakdh.org/ https://stribika.github.io/2015/01/04/secure-secure-shell.html Solution Recon\ufb01gure the service to use a unique Dif\ufb01e-Hellman moduli of 2048 bits or greater. Risk Factor Low CVSS Base Score 2.6 (CVSS2#AV:N/AC:H/Au:N/C:N/I:P/A:N) References BID 74733 CVE CVE-2015-4000 XREF OSVDB:122331 Plugin Information: Publication date: 2015/10/09, Modi\ufb01cation date: 2017/05/30 Hosts 192.168.15.85 (tcp/22) The SSH server is vulnerable to the Logjam attack because :  It supports diffiehellmangroup1sha1 key exchange.  It supports diffiehellmangroupexchangesha1 key exchange and allows a moduli smaller than or equal to 1024.  Note that only an attacker with nationstate level resources can effectively make use of the vulnerability, and only against sessions where the vulnerable key exchange algorithms are used.","risk":"Low","cvss":2.6,"cves":["CVE-2015-4000"],"hosts":[{"ip":"192.168.15.85","proto":"tcp","port":22}],"solution":"Recon\ufb01gure the service to use a unique Dif\ufb01e-Hellman moduli of 2048 bits or greater.","synopsis":"The remote host allows SSH connections with one or more Dif\ufb01e-Hellman moduli less than or equal to 1024 bits.","description":"The remote SSH server allows connections with one or more Dif\ufb01e-Hellman moduli less than or equal to 1024 bits. Through cryptanalysis, a third party can \ufb01nd the shared secret in a short amount of time (depending on modulus size and attacker resources). This allows an attacker to recover the plaintext or potentially violate the integrity of connections."},{"id":11219,"title":"Nessus SYN scanner Synopsis   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 34/125 It is possible to determine which TCP ports are open. De rver No 404 Error Code Check Synopsis The remote web server does not return 404 error codes. Description The remote web server is con\ufb01gured such that it does not return '404 Not Found' error codes when a nonexistent \ufb01le is requested, perhaps returning instead a site map, search page or authentication page.  Nessus has enabled some counter measures for this. However, they might be insuf\ufb01cient. If a great number of security holes are produced for this port, they might not all be accurate. Solution n/a Risk Factor None Plugin Information: Publication date: 2000/04/28, Modi\ufb01cation date: 2015/10/13 Hosts   https://static.tenable.com/documentation/reports/html/ExploitableVulnsByPlugin_w_remediations.html#idm255485888 120/125 192.168.15.43 (tcp/9090)   The following string will be used : TYPE='password'","risk":"None","cvss":null,"cves":[],"hosts":[{"ip":"192.168.15.43","proto":"tcp","port":9090}],"solution":"n/a","synopsis":"The remote web server does not return 404 error codes.","description":"The remote web server is con\ufb01gured such that it does not return '404 Not Found' error codes when a nonexistent \ufb01le is requested, perhaps returning instead a site map, search page or authentication page. Nessus has enabled some counter measures for this. However, they might be insuf\ufb01cient. If a great number of security holes are produced for this port, they might not all be accurate."},{"id":10940,"title":"Windows Terminal Services Enabled Synopsis The remote Windows host has Terminal Services enabled. Description Terminal Services allows a Windows user to remotely obtain a graphical login (and therefore act as a local user on the remote host).  If an attacker gains a valid login and password, this service could be used to gain further access on the remote host. An attacker may also use this service to mount a dictionary attack against the remote host to try to log in remotely.  Note that RDP (the Remote Desktop Protocol) is vulnerable to Man-in-th function simIsBlocked(stage,controls,scenario){if(stage==='edge')return controls.edge===true;if(stage==='evidence'){if(scenario.requires.includes('smb')&&controls.smb)return 'SMB / TCP 445 blocked';if(scenario.requires.includes('rdp')&&controls.rdp)return 'RDP / TCP 3389 blocked';if(scenario.requires.includes('ssh')&&controls.ssh)return 'Legacy SSH path removed';if(scenario.requires.includes('waf')&&controls.waf)return 'WAF policy blocked modeled web route';if(scenario.requires.includes('patch')&&controls.patch)return 'Vulnerable condition patched';}if(stage==='lateral'){if(scenario.requires.includes('mfa')&&controls.mfa)return 'Privileged access requires MFA';if(scenario.requires.includes('edr')&&controls.edr)return 'EDR containment interrupted endpoint path';}return false}

function simulateAttack(){const box=document.getElementById('sim');if(!box)return;const scenario=simScenarioById(document.getElementById('sim-scenario')?.value);const controls=simControlState();const nodes=scenario.stages;let stop=-1,reason='Simulation reached the modeled impact stage';for(let i=0;i<nodes.length;i++){const blockReason=simIsBlocked(nodes[i][2],controls,scenario);if(blockReason){stop=i;reason=blockReason;break}}const reached=stop<0?nodes:stop===0?[]:nodes.slice(0,stop);const status=stop>=0?'BLOCKED':'PATH REACHED MODELLED IMPACT';const score=stop>=0?Math.round((stop/(nodes.length-1))*100):100;box.innerHTML=`<div class="top" style="margin-bottom:8px"><div><h2 style="margin:0">${esc(scenario.id)} · ${esc(scenario.name)}</h2><div class="small muted">Simulation-only traversal using synthetic infrastructure + Nessus evidence.</div></div><span class="sim-badge ${stop>=0?'green':'orange'}">${status}</span></div><div class="sim-progress"><div class="row" style="justify-content:space-between"><span class="small muted">Modeled path completion</span><b>${score}%</b></div><div class="bar"><i id="simProgressFill" style="width:0%"></i></div></div><div class="sim-stage" id="simStage"></div><div class="sim-kpis"><div class="sim-kpi"><span class="muted">Stages</span><b>${nodes.length}</b></div><div class="sim-kpi"><span class="muted">Reached</span><b>${reached.length}</b></div><div class="sim-kpi"><span class="muted">Blocked</span><b>${stop>=0?'Yes':'No'}</b></div><div class="sim-kpi"><span class="muted">Risk</span><b class="${sevClass(scenario.risk)}">${scenario.risk}</b></div></div><div class="two" style="margin-top:12px"><div class="card"><h3 style="margin-top:0">Simulation event log</h3><div class="sim-log" id="simLog"></div></div><div class="card"><h3 style="margin-top:0">Why this path exists</h3><p class="small">${esc(scenario.note)}</p><p class="small"><span class="sim-badge">Evidence</span> Observed from Nessus: Plugin ${scenario.finding||'—'}</p><p class="small"><span class="sim-badge">Model</span> Network reachability, identity relationships and downstream impact are synthetic.</p><p class="small muted">No packets, exploits, credentials or real infrastructure are executed by this simulation.</p></div></div>`;const stageEl=document.getElementById('simStage');nodes.forEach((n,i)=>{stageEl.insertAdjacentHTML('beforeend',`<div class="sim-node ${n[3]==='observed'?'observed':'inferred'}" id="simNode-${i}"><div class="small muted">Stage ${i+1}</div><b>${esc(n[0])}</b><div class="small">${esc(n[1])}</div><div class="small muted">${n[3]}</div></div>${i<nodes.length-1?'<div class="sim-arrow">→</div>':''}`)});const log=document.getElementById('simLog');const progress=document.getElementById('simProgressFill');const maxStep=stop>=0?stop:nodes.length-1;let i=0;const tick=()=>{if(i>maxStep){if(stop>=0){log.insertAdjacentHTML('beforeend',`<div><span class="sim-badge green">STOP</span> ${esc(reason)} at stage ${stop+1}.</div>`)}else{log.insertAdjacentHTML('beforeend','<div><span class="sim-badge orange">MODEL</span> End of modeled path reached; this does not prove successful compromise.</div>')}progress.style.width=score+'%';return}document.querySelectorAll('.sim-node').forEach(x=>x.classList.remove('active'));const node=document.getElementById('simNode-'+i);if(node){node.classList.add('active');if(i<maxStep||stop<0)node.classList.add('reached');if(stop===i)node.classList.add('blocked')}const n=nodes[i];log.insertAdjacentHTML('beforeend',`<div>${new Date().toLocaleTimeString()} · <b>${esc(n[0])}</b> → ${esc(n[1])} <span class="muted">[${n[3]}]</span></div>`);log.scrollTop=log.scrollHeight;i++;setTimeout(tick,520)};tick()}

nteractive access</td><td>Identity / Lateral</td><td>SSH, RDP, LLMNR hypotheses</td></tr><tr><td>EDR</td><td>Endpoint containment</td><td>Lateral / Impact</td><td>Endpoint-dependent scenarios</td></tr></tbody></table></div></div>`)}

async function handleFile(file){let st=document.getElementById('importStatus');if(!st)return;st.innerHTML='<div class="analysis-box"><div class="spinner-row"><span class="spinner"></span><div><b>Analyzing Nessus report…</b><div class="small muted" id="analysisText">Reading file and validating source</div></div></div><div class="progress"><i></i></div><div class="analysis-steps"><span class="analysis-step active">1 · Read</span><span class="analysis-step">2 · Parse</span><span class="analysis-step">3 · Correlate assets</span><span class="analysis-step">4 · Build attack paths</span></div></div>';try{await new Promise(r=>setTimeout(r,350));let txt='Reading file and validating source';let analysisText=document.getElementById('analysisText');if(file.name.toLowerCase().endsWith('.pdf')){let hash=await sha256(file);await new Promise(r=>setTimeout(r,450));if(hash===DATA.source.sha256){fileName=file.name;st.innerHTML='<p class="tag green">PDF verified and loaded</p>';await new Promise(r=>setTimeout(r,250));render();}else{st.innerHTML='<p class="tag red">This PDF is not the pre-indexed supplied report. For a different PDF, export Nessus as .nessus XML or JSON and import that data.</p>'}}else{if(analysisText)analysisText.textContent='Parsing findings, assets, severity and CVSS data';await new Promise(r=>setTimeout(r,500));let txt=await file.text();let parsed;if(file.name.toLowerCase().endsWith('.json'))parsed=JSON.parse(txt);else parsed=parseSimple(txt);if(!parsed.findings?.length)throw Error('No findings detected');findings=parsed.findings;fileName=file.name;if(analysisText)analysisText.textContent='Correlating assets and building attack paths';await new Promise(r=>setTimeout(r,600));st.innerHTML='<p class="tag green">Imported '+findings.length+' findings and analyzed '+new Set(findings.flatMap(f=>f.hosts||[]).map(h=>h.ip)).size+' assets</p>';render()}}catch(e){st.innerHTML='<p class="tag red">Import error: '+esc(e.message)+'</p>'}} function parseSimple(t){let out=[];for(let m of t.matchAll(/^(\d{4,6})\s*\([^)]*\)\s*-\s*(.+)$/gm))out.push({id:+m[1],title:m[2],risk:'None',cvss:null,cves:[],hosts:[],solution:'',synopsis:'',description:''});return {findings:out}}
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function exportCSV(){let rows=[['Plugin','Title','Risk','CVSS','CVEs','Hosts'],...findings.map(f=>[f.id,f.title,f.risk,f.cvss??'',f.cves.join(';'),f.hosts.map(h=>h.ip+':'+h.port).join(';')])];download('attackpath-nessus.csv',rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}
function exportTXT(){let t='AttackPath AI — Nessus Remediation Report\n\nSource: '+fileName+'\nFindings: '+findings.length+'\nHosts: '+hosts.length+'\n\n';findings.filter(f=>f.risk!=='None').sort((a,b)=>sevOrder[b.risk]-sevOrder[a.risk]).forEach(f=>t+=`[${f.risk}] Plugin ${f.id} — ${f.title}\nCVSS: ${f.cvss??'N/A'}\nHosts: ${f.hosts.map(h=>h.ip+':'+h.port).join(', ')}\nSolution: ${f.solution}\n\n`);download('attackpath-remediation.txt',t,'text/plain')}
function setLoginState(on){const login=document.getElementById('loginScreen'),app=document.getElementById('appShell');if(on){login.classList.add('hidden');login.setAttribute('aria-hidden','true');login.style.display='none';app.classList.remove('hidden');app.removeAttribute('aria-hidden');app.style.display='flex'}else{login.classList.remove('hidden');login.setAttribute('aria-hidden','false');login.style.display='flex';app.classList.add('hidden');app.setAttribute('aria-hidden','true');app.style.display='none'}}
function login(){const u=(document.getElementById('loginUser')?.value||'').trim(),p=document.getElementById('loginPass')?.value||'';if(u==='admin'&&p==='attackpath'){sessionStorage.setItem('attackpath-auth','1');document.getElementById('sessionUser').textContent=u;setLoginState(true);render()}else{document.getElementById('loginError').textContent='Invalid prototype credentials.'}}
function logout(){sessionStorage.removeItem('attackpath-auth');setLoginState(false);document.getElementById('loginPass').value=''}
function updateDashClock(){const el=document.getElementById('dashClock');if(el)el.textContent=new Date().toLocaleString()}
setInterval(()=>{if(page==='liveattacks'&&liveState.running&&sessionStorage.getItem('attackpath-auth')==='1'){injectMockLiveEvent()}},15000);
setInterval(updateDashClock,1000);
setInterval(()=>{if(page==='dashboard'&&sessionStorage.getItem('attackpath-auth')==='1'){const el=document.querySelector('.source-card .source-time'); if(el&&!el.dataset.touched){document.querySelectorAll('.source-card .source-time').forEach(x=>{x.textContent='Last poll '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})})}}},5000);
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
if(sessionStorage.getItem('attackpath-auth')==='1'){setLoginState(true);document.getElementById('sessionUser').textContent='admin';render()}else{setLoginState(false)}
</script></body></html>
